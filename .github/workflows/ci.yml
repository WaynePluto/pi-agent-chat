name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify bundle and smoke load
        run: pnpm verify

      - name: Check VSIX contents
        shell: pwsh
        run: |
          pnpm exec vsce ls --no-dependencies --readme-path README.md
          pnpm exec vsce package `
            --target linux-x64 `
            --no-dependencies `
            --no-rewrite-relative-links `
            --readme-path README.md `
            --out pi-agent-chat-ci.vsix
